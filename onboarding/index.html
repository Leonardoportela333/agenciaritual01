<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onboarding de Tráfego · Ritual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
<style>
/* VOICE: proprietary, confident, calm — a Ritual instrument, not a survey.
   IDEA: the ritual of a kickoff — each step is a marked passage, a red tick over a grey rule.
   PICTURE: the form itself; a vertical "rite" rail with step marks and a live progress line.
   COLOUR and TYPE: #0A0A0A ground, #E3010D red accent, #FAFAFA ink, #A6A6A6 grey; Inter Tight.
   LAYOUT: rail left / one calm column right; on phones a sticky progress bar and stacked fields. */
:root{color-scheme:dark;--bg:#0A0A0A;--bg2:#121212;--bg3:#1A1A1A;--line:#2A2A2A;--ink:#FAFAFA;--mut:#A6A6A6;--dim:#6E6E6E;--red:#E3010D;--red2:#FF2A35;--ok:#3FBF7F;--warn:#E8A33C}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Inter Tight",Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
.mk{position:relative;padding-top:18px}
.mk::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--line)}
.mk::after{content:"";position:absolute;left:0;top:-1px;width:28px;height:3px;background:var(--red)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:20px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 18px var(--red)}
.logo small{font-weight:500;color:var(--mut);font-size:13px;letter-spacing:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--bg3);cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;transition:background .15s,border-color .15s}
.btn:hover{border-color:#444}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red2)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
/* ---------- form shell ---------- */
.shell{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow:auto;padding:32px 24px;border-right:1px solid var(--line);background:linear-gradient(180deg,#0E0E0E,#0A0A0A)}
.rail .logo{margin-bottom:36px}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:11px;top:8px;bottom:8px;width:1px;background:var(--line)}
.steps .fill{position:absolute;left:11px;top:8px;width:1px;background:var(--red);transition:height .4s}
.steps li{position:relative}
.steps button{display:flex;gap:14px;align-items:center;width:100%;padding:8px 4px;border:0;background:none;text-align:left;cursor:pointer;color:var(--mut);font-size:14px;border-radius:8px}
.steps button:disabled{cursor:default;opacity:.45}
.steps .dot{flex:none;width:23px;height:23px;border-radius:50%;border:1px solid #3a3a3a;background:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:700;position:relative;z-index:1}
.steps .done .dot{background:var(--red);border-color:var(--red);color:#fff}
.steps .cur button{color:var(--ink);font-weight:600}
.steps .cur .dot{border-color:var(--red);box-shadow:0 0 0 4px rgba(227,1,13,.18)}
.rail-foot{margin-top:28px;font-size:13px;color:var(--dim)}
.save{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.save.busy::before{background:var(--warn)}
.main{padding:48px max(5vw,20px) 120px;max-width:820px;width:100%}
.topbar{display:none}
.eyebrow{color:var(--mut);font-size:14px;margin:0 0 10px}
h1{font-size:clamp(32px,4.4vw,48px);line-height:1.05;letter-spacing:-.03em;margin:0 0 14px;text-wrap:balance;font-weight:700}
h2{font-size:24px;line-height:1.15;letter-spacing:-.02em;margin:0 0 8px;font-weight:700}
h3{font-size:17px;margin:0 0 4px;font-weight:600}
.lead{color:var(--mut);font-size:17px;max-width:62ch;margin:0 0 32px}
.sec{margin:40px 0 18px}
.sec h3{font-size:15px;color:var(--mut);font-weight:600}
.f{margin:0 0 26px}
.f>label,.f>.lb{display:block;font-weight:600;font-size:16px;margin-bottom:4px}
.req{color:var(--red);margin-left:2px}
.opt{color:var(--dim);font-weight:400;font-size:13px;margin-left:6px}
.help{color:var(--mut);font-size:14px;margin:0 0 10px;max-width:64ch}
.in{width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:16px;transition:border-color .15s}
.in:focus{border-color:var(--red);outline:none}
textarea.in{min-height:104px;resize:vertical;line-height:1.5}
.in::placeholder{color:#5c5c5c}
.err .in{border-color:var(--red)}
.emsg{color:var(--red2);font-size:13px;margin-top:6px;display:none}
.err .emsg{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;font-size:15px;text-align:left}
.chip[aria-pressed=true]{background:rgba(227,1,13,.14);border-color:var(--red);color:#fff}
.chip.ns[aria-pressed=true]{background:#222;border-color:#555}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.nsbox{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--mut);cursor:pointer;width:max-content}
.nsbox input{width:18px;height:18px;accent-color:var(--red)}
.asset{padding:16px 0;border-top:1px solid var(--line)}
.asset .hd{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.asset .nm{font-weight:600}
.asset .hp{color:var(--mut);font-size:14px;max-width:46ch}
.asset .chips .chip{min-height:38px;padding:6px 13px;font-size:14px}
.asset .det{margin-top:10px}
.note{border:1px solid var(--line);border-left:3px solid var(--red);background:var(--bg2);border-radius:12px;padding:14px 16px;font-size:15px;color:#d8d8d8;margin:0 0 28px}
.note b{color:#fff}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:24px;border-top:1px solid var(--line)}
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.svc button{padding:20px;border-radius:16px;border:1px solid var(--line);background:var(--bg2);text-align:left;cursor:pointer;min-height:130px}
.svc button[aria-pressed=true]{border-color:var(--red);background:linear-gradient(160deg,rgba(227,1,13,.18),rgba(227,1,13,.03))}
.svc b{display:block;font-size:18px;margin:10px 0 4px}
.svc span{color:var(--mut);font-size:14px}
.ic{width:34px;height:34px;border-radius:10px;background:#1f1f1f;display:grid;place-items:center}
.facts{display:flex;flex-wrap:wrap;gap:10px 28px;color:var(--mut);font-size:14px;margin:0 0 30px}
.facts b{color:var(--ink)}
.rev{list-style:none;padding:0;margin:0 0 24px}
.rev li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 10px;border-radius:999px;background:#1d1d1d;color:var(--mut);white-space:nowrap}
.tag.ok{color:var(--ok);background:rgba(63,191,127,.1)}
.tag.w{color:var(--warn);background:rgba(232,163,60,.1)}
.tag.r{color:#ff6b72;background:rgba(227,1,13,.12)}
.hero-done{padding:20px 0}
.big-check{width:72px;height:72px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin-bottom:24px;box-shadow:0 0 50px rgba(227,1,13,.45)}
.card{border:1px solid var(--line);border-radius:16px;background:var(--bg2);padding:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#fff;color:#000;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
/* ---------- panel ---------- */
.pn{max-width:1240px;margin:0 auto;padding:28px max(4vw,16px) 100px}
.pn-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;margin:0 0 24px}
.kpi{padding:14px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;text-align:left}
.kpi[aria-pressed=true]{border-color:var(--red)}
.kpi b{display:block;font-size:28px;line-height:1;margin-bottom:8px;font-weight:700}
.kpi span{font-size:12.5px;color:var(--mut);line-height:1.25;display:block}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools .in{max-width:320px;min-height:42px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#101010}
.meter{height:6px;border-radius:9px;background:#222;overflow:hidden;width:90px}
.meter i{display:block;height:100%;background:var(--red)}
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,#666)}
.empty{padding:48px 20px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:16px}
.det-hd{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start;margin-bottom:24px}
.det-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{flex:none;padding:12px 14px;border:0;background:none;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;font-weight:500;min-height:44px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--red)}
.qa{padding:12px 0;border-top:1px solid #1e1e1e;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:16px}
.qa .q{color:var(--mut);font-size:14px}
.qa .a{white-space:pre-wrap;overflow-wrap:anywhere}
.qa .a.no{color:var(--dim);font-style:italic}
.ck{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid #1e1e1e;cursor:pointer}
.ck input{width:20px;height:20px;margin-top:2px;accent-color:var(--red);flex:none}
.ck .w{color:var(--mut);font-size:13px;display:block}
.ck.on .t{color:var(--mut);text-decoration:line-through}
.grp{margin-bottom:28px}
.grp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.side .card{margin-bottom:16px}
.side label{font-size:13px;color:var(--mut);display:block;margin-bottom:6px}
.prog{display:flex;justify-content:space-between;font-size:14px;margin:10px 0 6px}
.bar{height:6px;background:#222;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.hist{font-size:13px;color:var(--mut);list-style:none;padding:0;margin:0}
.hist li{padding:6px 0;border-top:1px solid #1e1e1e}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
.modal.on{display:flex}
.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto;background:#111}
.pill-ok{color:var(--ok)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.det-grid{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){
 .shell{display:block}
 .rail{position:fixed;inset:0 25% 0 0;z-index:30;transform:translateX(-102%);transition:transform .25s;height:100%}
 .rail.open{transform:none;box-shadow:20px 0 60px #000}
 .topbar{display:flex;position:sticky;top:0;z-index:20;background:rgba(10,10,10,.92);backdrop-filter:blur(8px);padding:12px 16px;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
 .topbar .t{flex:1;font-size:14px}
 .topbar .t b{display:block;font-size:15px}
 .topbar .pb{position:absolute;left:0;bottom:-1px;height:2px;background:var(--red);transition:width .3s}
 .main{padding-top:28px}
}
@media(max-width:600px){
 .row2,.svc{grid-template-columns:minmax(0,1fr)}
 .svc button{min-height:0}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
 .qa{grid-template-columns:minmax(0,1fr);gap:4px}
 .nav .btn{flex:1}
 table{font-size:14px}
 .stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mut);font-size:13px}.stack td:empty{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
{

const $=s=>document.querySelector(s);

const use=n=>(window.claude&&typeof window.claude.use==='function')?window.claude.use(n).catch(()=>null):Promise.resolve(null);
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const NS='__ns';
const fmtDate=t=>t?new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fmtDT=t=>t?new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const uid=()=>'RTL-'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copiado');return true}catch(e){toast('Não foi possível copiar automaticamente');return false}}
const digits=s=>String(s||'').replace(/\D/g,'');
function cnpjOk(v){const c=digits(v);if(c.length!==14||/^(\d)\1+$/.test(c))return false;const calc=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return calc(12)===+c[12]&&calc(13)===+c[13]}
const emailOk=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||'').trim());
const phoneOk=v=>{const d=digits(v).replace(/^55(?=\d{10,11}$)/,'');return d.length===10||d.length===11};
function maskCnpj(v){const d=digits(v).slice(0,14);return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2')}
function maskPhone(v){let d=digits(v);if(d.length>11&&d.startsWith('55'))d=d.slice(2);d=d.slice(0,11);if(d.length<=2)return d?'('+d:'';if(d.length<=6)return`(${d.slice(0,2)}) ${d.slice(2)}`;if(d.length<=10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`}
function maskMoney(v){const d=digits(v);if(!d)return'';return'R$ '+(+d).toLocaleString('pt-BR')}
const money=v=>+digits(v)||0;

/* =========================================================
   Esquema do formulário
   ========================================================= */
const hasMeta=a=>a.servicos==='meta'||a.servicos==='ambos';
const hasGoogle=a=>a.servicos==='google'||a.servicos==='ambos';
const hasSite=a=>a.site_inst?.v==='sim'||a.landing?.v==='sim'||a.ecommerce?.v==='sim'||!!(a.site&&a.site!==NS);
const isEcom=a=>a.ecommerce?.v==='sim'||(a.canais||[]).includes('E-commerce');
const YN=['sim','nao','ns'];const YNL={sim:'Sim',nao:'Não',ns:'Não sei informar'};
const AL={sim:'Já possuo',nao:'Não possuo',ns:'Não sei informar'};

const f=(t)=>(id,l,o={})=>({id,l,t,...o});
const T=f('text'),TA=f('area'),E=f('email'),P=f('tel'),C=f('cnpj'),U=f('url'),R=f('radio'),M=f('multi'),Y=f('yn'),A=f('asset'),$M=f('money'),N=f('num'),AC=f('acc');
const S=(sec,o={})=>({sec,...o});

const STEPS=[
{k:'inicio',t:'Começo',title:'Vamos ritualizar o início da sua operação',intro:'Este é o ponto de partida do trabalho da Ritual com a sua marca. Com estas respostas, nossa equipe planeja, configura e lança suas campanhas sem precisar te perguntar a mesma coisa duas vezes.',fields:[
 R('servicos','Quais canais você contratou com a Ritual?',{req:true,svc:true,h:'Mostramos só as perguntas do que você contratou.'}),
]},
{k:'empresa',t:'Empresa',title:'Dados gerais da empresa',intro:'Quem é você no papel e no mundo digital.',fields:[
 T('nome','Nome da empresa',{req:true,ph:'Como a marca é conhecida'}),
 T('razao','Razão social',{req:true,w:1}),C('cnpj','CNPJ',{req:true,w:1,ph:'00.000.000/0000-00'}),
 T('resp','Nome do responsável pelo projeto',{req:true,w:1}),T('cargo','Cargo do responsável',{w:1}),
 E('email','E-mail',{req:true,w:1,ph:'nome@empresa.com.br'}),P('whats','WhatsApp',{req:true,w:1,ph:'(11) 98765-4321'}),
 U('site','Site',{ns:false,ph:'www.suaempresa.com.br',h:'Se ainda não tiver site, deixe em branco.'}),
 T('instagram','Instagram',{w:1,ph:'@suamarca'}),T('facebook','Facebook',{w:1,ph:'facebook.com/suamarca'}),
 T('endereco','Endereço comercial'),
 R('segmento','Segmento de atuação',{req:true,o:['Saúde e bem-estar','Alimentação','Moda e beleza','Educação','Serviços profissionais','Imobiliário','Varejo / e-commerce','Indústria','Tecnologia','Turismo e eventos','Outro']}),

{k:'negocio',t:'Negócio',title:'Sobre o negócio',intro:'Antes de qualquer campanha, precisamos entender como sua empresa ganha dinheiro.',fields:[
 TA('vende','O que sua empresa vende?',{req:true}),
 TA('produtos','Quais são os principais produtos ou serviços?',{req:true}),
 TA('lucrativos','Quais são os mais lucrativos?',{ns:true}),
 TA('prioritarios','Quais são prioridade para divulgar agora?',{req:true,h:'O que você mais quer vender nos próximos meses.'}),
 $M('ticket','Ticket médio',{w:1,ns:true,h:'Valor médio que um cliente gasta por compra.'}),
 T('margem','Margem média de lucro',{w:1,ns:true,ph:'Ex.: 35%',h:'Ajuda a definir quanto podemos pagar por venda.'}),
 TA('processo','Como funciona o processo comercial?',{req:true,h:'Do primeiro contato até o pagamento.'}),

];
STEPS.forEach(s=>s.fields.forEach(x=>{x.step=s.k}));
const FIELDS=STEPS.flatMap(s=>s.fields.filter(x=>!x.sec));
const FBY=Object.fromEntries(FIELDS.map(x=>[x.id,x]));
const SVC={meta:'Meta Ads',google:'Google Ads',ambos:'Meta + Google'};

const stepOn=(s,a)=>!s.when||s.when(a);
const fieldOn=(x,a)=>(!x.show||x.show(a))&&stepOn(STEPS.find(s=>s.k===x.step),a);
function filled(x,a){const v=a[x.id];if(x.t==='asset'||x.t==='acc')return!!(v&&v.v);if(Array.isArray(v))return v.length>0;return v!==undefined&&v!==null&&String(v).trim()!==''}
function fieldError(x,a){
 const v=a[x.id];
 if(x.req&&!filled(x,a))return'Campo obrigatório';
 if(x.t==='radio'||x.t==='multi'){const o=x.o||[];const has=x.t==='radio'?v==='Outro':(v||[]).includes('Outro');if(o.includes('Outro')&&has&&!String(a[x.id+'_outro']||'').trim())return'Conte qual é a outra opção'}
 if(!v||v===NS)return'';
 if(x.t==='email'&&!emailOk(v))return'E-mail inválido';
 if(x.t==='tel'&&!phoneOk(v))return'Informe DDD + número';
 if(x.t==='cnpj'&&!cnpjOk(v))return'CNPJ inválido. Confira os números';
 return'';
}
const stepErrors=(s,a)=>s.fields.filter(x=>!x.sec&&fieldOn(x,a)&&fieldError(x,a));
const activeSteps=a=>STEPS.filter(s=>stepOn(s,a));
function completion(a){const fs=FIELDS.filter(x=>fieldOn(x,a));const n=fs.filter(x=>filled(x,a)).length;return fs.length?Math.round(n/fs.length*100):0}

/* valor legível */
function show(x,a){
 const v=a[x.id];
 if(x.t==='asset'){if(!v||!v.v)return'';return AL[v.v]+(v.d?' · '+v.d:'')}
 if(x.t==='acc'){if(!v||!v.v)return'';return ACL[v.v]}
 if(x.t==='yn')return v?YNL[v]:'';
 if(x.id==='servicos')return SVC[v]||'';
 if(v===NS)return'Não sei informar';
 let out=Array.isArray(v)?v.join(', '):(v??'');
 if((x.t==='radio'&&v==='Outro')||(x.t==='multi'&&(v||[]).includes('Outro')))out+=' ('+(a[x.id+'_outro']||'')+')';
 return String(out);
}

/* =========================================================
   Inteligência pós-onboarding: pendências e checklists
   ========================================================= */
function pendencias(a){
 const out=[];
 FIELDS.forEach(x=>{if(!fieldOn(x,a))return;const v=a[x.id];
  if(x.req&&!filled(x,a))out.push({g:'Obrigatório sem resposta',t:x.l,s:x.step});
  else if(v===NS||v==='ns'||(v&&v.v==='ns')||(Array.isArray(v)&&v.includes('Não sei informar'))||v==='Não sei informar')out.push({g:'Cliente não soube informar',t:x.l,s:x.step});
 });
 ['ticket','margem','taxa_conv','c2','c3','inv_meta','inv_google'].forEach(k=>{const x=FBY[k];if(fieldOn(x,a)&&!filled(x,a))out.push({g:'Informação estratégica em branco',t:x.l,s:x.step})});
 FIELDS.filter(x=>x.t==='acc'&&fieldOn(x,a)&&a[x.id]?.v==='ajuda').forEach(x=>out.push({g:'Cliente pediu ajuda com acesso',t:x.l,s:'acessos'}));
 if(a.servicos==='ambos'&&money(a.inv_meta)&&money(a.inv_google)&&money(a.inv_meta)+money(a.inv_google)!==money(a.inv_total))out.push({g:'Inconsistência',t:'Soma Meta + Google difere do investimento total',s:'invest'});
 if(!filled(FBY.link1,a))out.push({g:'Materiais',t:'Nenhuma pasta de materiais enviada',s:'criativos'});
 return out;
}
function acessosList(a){
 return FIELDS.filter(x=>x.t==='acc'&&fieldOn(x,a)).map(x=>({id:'ac:'+x.id,t:x.l,plat:FIELDS.indexOf(x)<FIELDS.indexOf(FBY.ac_gads)?'Meta Ads':'Google',w:a[x.id]?.v?'Cliente: '+ACL[a[x.id].v]:'Cliente não respondeu'}));
}
function materiaisList(a){
 const L=[['id_visual','Identidade visual (logo, cores, fontes)'],['manual','Manual de marca'],['fotos','Fotos profissionais'],['videos','Vídeos institucionais'],['depoimentos','Depoimentos de clientes'],['mat_ant','Materiais de campanhas anteriores']];
 if(hasMeta(a))L.push(['criativos_disp','Criativos de anúncios já existentes']);
 const r=L.map(([k,t])=>{const v=a[k];return{id:'mt:'+k,t:(v==='sim'?'Receber: ':v==='nao'?'Produzir/planejar: ':'Confirmar: ')+t,w:'Cliente: '+(YNL[v]||'não respondeu')}});
 const links=['link1','link2','link3'].map(k=>a[k]).filter(Boolean);
 r.push({id:'mt:links',t:'Organizar pasta de materiais do cliente',w:links.length?links.join('  ·  '):'Nenhum link enviado: solicitar'});
 return r;
}
function checklist(a){
 const G=[];const g=(n,items)=>{const it=items.filter(Boolean);if(it.length)G.push({n,items:it})};
 const t=(id,txt,w)=>({id:'tk:'+id,t:txt,w});
 const st=k=>a[k]?.v;
 const has=(k,id,ok,no,ns)=>st(k)==='sim'?t(id,ok):st(k)==='nao'?t(id,no,'Cliente não possui'):t(id,ns||ok+' (confirmar se existe)','Cliente não soube informar');
 const obj=show(FBY.objetivo,a);const dest=show(FBY.meta_destino,a);const prio=a.g_prioridade||[];
 g('Planejamento',[
  t('neg','Análise do negócio',a.segmento?show(FBY.segmento,a):''),
  t('obj','Definição dos objetivos e KPIs',obj&&('Objetivo: '+obj+(a.meta_mensal_d?' · Meta: '+a.meta_mensal_d:''))),

 else if(PN.tab==='acessos'){const pl=[...new Set(k.ac.map(i=>i.plat))];body=`<p class="help">Marque quando o acesso tiver sido concedido à Ritual por convite oficial.</p>`+pl.map(p=>{const it=k.ac.filter(i=>i.plat===p);return`<div class="grp"><div class="grp-h"><h3>${p}</h3><span class="tag">${it.filter(i=>ck[i.id]).length}/${it.length}</span></div>${ckList(it)}</div>`}).join('')}
 else if(PN.tab==='materiais')body=`<div class="grp">${ckList(k.mt)}</div>`;
 else if(PN.tab==='tecnico')body=`<p class="help">Gerado a partir das respostas: só aparecem as tarefas que fazem sentido para a estrutura e os canais deste cliente.</p>`+checklist(a).map(g=>`<div class="grp"><div class="grp-h"><h3>${esc(g.n)}</h3><span class="tag">${g.items.filter(i=>ck[i.id]).length}/${g.items.length}</span></div>${ckList(g.items)}</div>`).join('');
 const bar=(l,n,t)=>`<div class="prog"><span>${l}</span><span>${n}/${t}</span></div><div class="bar"><i style="width:${t?n/t*100:0}%"></i></div>`;
 $('#app').innerHTML=`<div class="pn"><div class="pn-top"><button class="btn ghost sm" id="back">← Todos os onboardings</button><div style="display:flex;gap:8px;flex-wrap:wrap">${c.answers?'<button class="btn sm" id="cpsum">Copiar resumo</button><button class="btn sm" id="xjson">Exportar JSON</button><button class="btn pri sm" id="xpdf">Exportar PDF</button>':''}</div></div>
 <div class="det-hd"><div class="mk" style="padding-top:22px"><h1 style="font-size:clamp(28px,3.6vw,42px);margin-bottom:8px">${esc(c.name||'Sem nome')}</h1><div class="facts" style="margin:0"><span>${esc(c.id||c._id)}</span><span>${esc(SVC[c.services]||'')}</span><span>Enviado ${c.submittedAt?fmtDT(c.submittedAt):'—'}</span>${c.answers?`<span>Preenchido ${k.comp}%</span>`:''}</div></div></div>
 <div class="det-grid"><div><div class="tabs" role="tablist">${tabs.map(([t,l])=>`<button role="tab" data-tab="${t}" aria-selected="${PN.tab===t}">${esc(l)}</button>`).join('')}</div>${body}</div>
 <aside class="side"><div class="card"><label for="sts">Status do onboarding</label><select class="in" id="sts">${STATUS.map(([s,l])=>`<option value="${s}" ${c.status===s?'selected':''}>${l}</option>`).join('')}</select>${c.answers&&sug!==c.status?`<p class="help" style="margin:10px 0 0">Sugestão pelo checklist: <button class="btn sm ghost" id="sug" data-s="${sug}">${esc(STL[sug])}</button></p>`:''}</div>
 ${c.answers?`<div class="card">${bar('Acessos',k.pAc,k.ac.length)}${bar('Materiais',k.pMt,k.mt.length)}${bar('Checklist técnico',k.pTk,k.tk.length)}</div>`:''}
 <div class="card"><label for="notes">Observações internas</label><textarea class="in" id="notes" placeholder="Visíveis só para a equipe Ritual">${esc(c.notes||'')}</textarea><p class="help" id="nsv" style="margin:6px 0 0;font-size:13px"></p></div>
 <div class="card"><label>Histórico</label><ul class="hist">${(c.history||[]).slice().reverse().map(h=>`<li>${esc(fmtDT(h.at))} · ${esc(STL[h.s]||h.s)}${h.by?' · '+esc(h.by):''}</li>`).join('')||'<li>—</li>'}</ul></div>
 <button class="btn ghost sm" id="del" style="color:#ff6b72">Excluir onboarding</button></aside></div></div>`;
 const app=$('#app');
 app.onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='back'){PN.open=null;renderPanel();return}
  if(b.dataset.tab){PN.tab=b.dataset.tab;renderDetail();return}
  if(b.id==='sug'){const s=b.dataset.s;await writeClient(c,{status:s},{s,at:Date.now(),by:'Sugestão do checklist'});return}
  if(b.id==='cpsum')return copy(textSummary(a,{id:c.id||c._id,sentAt:c.submittedAt}).split('Para a equipe Ritual')[0].trim());
  if(b.id==='xjson')return save(`onboarding-${slug(c.name)}.json`,JSON.stringify({...packet(a,{id:c.id,sentAt:c.submittedAt}),status:c.status,checks:c.checks||{},notes:c.notes||''},null,1));
  if(b.id==='xpdf'){const bl=buildPDF(a,{id:c.id||c._id,sentAt:c.submittedAt},c);if(!bl)return toast('Gerador de PDF carregando, tente de novo');return save(`onboarding-${slug(c.name)}.pdf`,bl)}
  if(b.id==='sendmsg')return copy(inviteMsg(c.name,PUBLIC_URL));
  if(b.id==='imp')return modalImport();
  if(b.id==='del'){openModal(`<h2>Excluir ${esc(c.name)}?</h2><p class="help">As respostas, checklists e observações deste cliente serão apagados de forma definitiva.</p><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px"><button class="btn ghost" data-close>Cancelar</button><button class="btn pri" id="okd">Excluir</button></div>`);$('#okd').onclick=async()=>{try{await DB.doc('clients/'+c._id).delete();closeModal();PN.open=null;renderPanel();toast('Excluído')}catch(e){toast('Sem permissão')}};return}
 };
 app.onchange=async e=>{const el=e.target;
  if(el.dataset.ck){const checks={...(c.checks||{}),[el.dataset.ck]:el.checked};el.closest('.ck').classList.toggle('on',el.checked);try{await writeClient(c,{checks})}catch(_){el.checked=!el.checked}}
  if(el.id==='sts'){await writeClient(c,{status:el.value},{s:el.value,at:Date.now(),by:'Equipe'})}
 };
 const n=$('#notes');n.oninput=()=>{$('#nsv').textContent='Salvando…';clearTimeout(n.t);n.t=setTimeout(async()=>{try{await writeClient(c,{notes:n.value});const s=$('#nsv');if(s)s.textContent='Salvo'}catch(_){}},800)};
}

/* =========================================================
   Roteamento e inicialização
   ========================================================= */
function route(){if(location.hash==='#painel'){subscribePanel();renderPanel()}else{PN.open=null;renderForm()}}
window.addEventListener('hashchange',()=>{route();scrollTo(0,0)});
route();
(async()=>{
 const [db,user]=await Promise.all([use('db'),use('user')]);
 DB=db;USER=user;
 if(user){const w=await user.can('data.write').catch(()=>null);const ed=await user.canEdit().catch(()=>false);CAN=!!db&&(w===true||ed===true)}
 if(DB)DB.doc('config/main').get().then(s=>{if(s.exists){CONFIG={...CONFIG,...s.data()};if(location.hash!=='#painel')renderForm()}}).catch(()=>{});
 route();
})();
}
</script>
</body>
</html>
